[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gprd"
version = "1.0.0"
description = "Global Procurement Research Dataset: Cross-Country Causal Analysis Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Abduxoliq Ashuraliyev", email = "Jack00040008@outlook.com"}
]
keywords = [
    "public-procurement",
    "ocds",
    "open-contracting",
    "regression-discontinuity",
    "causal-inference",
    "transparency",
    "e-government"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.2",
    "requests>=2.31",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "click>=8.1",
    "textstat>=0.7",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.3",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "myst-parser>=1.0",
]
full = [
    "snakemake>=7.32",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.14",
    "jupyterlab>=4.0",
    "linearmodels>=4.27",
    "arch>=5.3",
]

[project.urls]
Documentation = "https://github.com/ProgrmerJack/Public-Procurement-Control-Surface/docs/"
Repository = "https://github.com/ProgrmerJack/Public-Procurement-Control-Surface"
Issues = "https://github.com/ProgrmerJack/Public-Procurement-Control-Surface/issues"

[project.scripts]
gprd = "scripts.lib.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=scripts/lib --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
